# yaml-language-server: $schema=https://json.schemastore.org/chart.json
apiVersion: v2
name: external-dns-crds
description: >-
  A Helm chart to install the CustomResourceDefinitions for ExternalDNS
  (DNSEndpoint, DNSRecord)
type: application
version: 0.24.0
appVersion: 0.24.0
kubeVersion: ">=1.25.0-0"
home: https://kubernetes-sigs.github.io/external-dns/
icon: >-
  https://raw.githubusercontent.com/kubernetes-sigs/external-dns/master/docs/img/external-dns.png
sources:
- https://github.com/dsohqlab/helm-charts
- https://github.com/kubernetes-sigs/external-dns
keywords:
- crds
- external-dns
maintainers:
- name: dsohqlab
  url: https://github.com/dsohqlab
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: DNSEndpoint
      version: v1alpha1
      name: dnsendpoints.externaldns.k8s.io
      displayName: DNSEndpoint
      description: >-
        DNSEndpoint is a contract that a user-specified CRD must implement to be used
        as a source for external-dns
    - kind: DNSRecord
      version: v1alpha1
      name: dnsrecords.externaldns.k8s.io
      displayName: DNSRecord
      description: DNSRecord custom resource
  artifacthub.io/links: |
    - name: Upstream project
      url: https://kubernetes-sigs.github.io/external-dns/
    - name: Upstream repository
      url: https://github.com/kubernetes-sigs/external-dns
    - name: Upstream CRD source (config/crd/standard)
      url: https://github.com/kubernetes-sigs/external-dns/tree/v0.24.0/config/crd/standard
    - name: Chart source
      url: https://github.com/dsohqlab/helm-charts/tree/main/charts/external-dns-crds
    - name: Verify signature and attestations
      url: https://github.com/dsohqlab/helm-charts#verifying-what-you-install
  helm.dsohqlab.com/upstream-repo: https://github.com/kubernetes-sigs/external-dns
  helm.dsohqlab.com/upstream-tag: v0.24.0
  helm.dsohqlab.com/upstream-commit: c40894ac060e0920b2b49035df18005954f83a7a
  artifacthub.io/changes: |
    - Initial release, CRDs from upstream v0.24.0
