# yaml-language-server: $schema=https://json.schemastore.org/chart.json
apiVersion: v2
name: cert-manager-crds
description: >-
  A Helm chart to install the CustomResourceDefinitions for cert-manager
  (certificates, issuers, ACME orders and challenges)
type: application
version: 1.21.3
appVersion: 1.21.3
kubeVersion: ">=1.25.0-0"
home: https://cert-manager.io
icon: https://raw.githubusercontent.com/cert-manager/cert-manager/master/logo/logo.svg
sources:
- https://github.com/dsohqlab/helm-charts
- https://github.com/cert-manager/cert-manager
keywords:
- crds
- cert-manager
maintainers:
- name: dsohqlab
  url: https://github.com/dsohqlab
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: CertificateRequest
      version: v1
      name: certificaterequests.cert-manager.io
      displayName: CertificateRequest
      description: >-
        A CertificateRequest is used to request a signed certificate from one of the
        configured issuers
    - kind: Certificate
      version: v1
      name: certificates.cert-manager.io
      displayName: Certificate
      description: >-
        A Certificate resource should be created to ensure an up to date and signed
        X.509 certificate is stored in the Kubernetes Secret resource named in
        `spec.secretName`
    - kind: Challenge
      version: v1
      name: challenges.acme.cert-manager.io
      displayName: Challenge
      description: Challenge is a type to represent a Challenge request with an ACME server
    - kind: ClusterIssuer
      version: v1
      name: clusterissuers.cert-manager.io
      displayName: ClusterIssuer
      description: >-
        A ClusterIssuer represents a certificate issuing authority which can be
        referenced as part of `issuerRef` fields
    - kind: Issuer
      version: v1
      name: issuers.cert-manager.io
      displayName: Issuer
      description: >-
        An Issuer represents a certificate issuing authority which can be referenced as
        part of `issuerRef` fields
    - kind: Order
      version: v1
      name: orders.acme.cert-manager.io
      displayName: Order
      description: Order is a type to represent an Order with an ACME server
  artifacthub.io/links: |
    - name: Upstream project
      url: https://cert-manager.io
    - name: Upstream repository
      url: https://github.com/cert-manager/cert-manager
    - name: Upstream CRD source (deploy/crds)
      url: https://github.com/cert-manager/cert-manager/tree/v1.21.3/deploy/crds
    - name: Chart source
      url: https://github.com/dsohqlab/helm-charts/tree/main/helm-charts/cert-manager-crds
    - name: Verify signature and attestations
      url: https://github.com/dsohqlab/helm-charts#verifying-what-you-install
  helm.dsohqlab.com/upstream-repo: https://github.com/cert-manager/cert-manager
  helm.dsohqlab.com/upstream-tag: v1.21.3
  helm.dsohqlab.com/upstream-commit: 925c22283de556172d48d96a165dc2fa27f7a6ff
  artifacthub.io/changes: |
    - Initial release, CRDs from upstream v1.21.3
