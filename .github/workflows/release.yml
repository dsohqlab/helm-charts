# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9 # v1.8.0
        with:
          config: cr.yaml
          skip_existing: false
          oci_registry_url: oci://ghcr.io/${{ github.repository_owner }}/charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout GitHub Pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: true

      - name: Install yq
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1

      - name: Update Available Charts README section
        shell: bash
        run: |
          set -euo pipefail

          INDEX="gh-pages/index.yaml"
          README="gh-pages/README.md"

          # Validate files
          [[ -f "$INDEX" ]] || {
            echo "::error::Helm index not found: $INDEX"
            exit 1
          }

          [[ -f "$README" ]] || {
            echo "::error::README not found: $README"
            exit 1
          }

          # Validate index structure
          yq -e '.entries | tag == "!!map"' "$INDEX" >/dev/null

          # Generate chart table
          TABLE=$(yq -r '
            .entries
            | to_entries[]
            | select(.value | length > 0)
            | .key as $name
            | (.value | sort_by(.version) | .[-1]) as $chart
            | "| `\($name)` | `\($chart.version)` | `\($chart.appVersion // "-")` | \($chart.description // "") |"
          ' "$INDEX")

          # Validate README section
          if ! grep -Fxq "## Available Charts" "$README"; then
            echo "::error::Missing Available Charts section"
            exit 1
          fi

          TMP=$(mktemp "${README}.XXXXXX")
          trap 'rm -f "$TMP"' EXIT

          # Replace only Available Charts content
          TABLE="$TABLE" awk '
            BEGIN {
              table = ENVIRON["TABLE"]
            }

            /^## Available Charts$/ {
              print
              print ""
              print "| Chart | Version | App Version | Description |"
              print "| --- | --- | --- | --- |"

              if (table != "") {
                print table
              }

              updating = 1
              next
            }

            updating && /^## / {
              updating = 0
              print ""
            }

            !updating {
              print
            }
          ' "$README" > "$TMP"

          # Update only when content changed
          if ! cmp -s "$README" "$TMP"; then
            mv "$TMP" "$README"
            echo "Available Charts section updated."
          else
            echo "Available Charts section is already up to date."
          fi

      - name: Commit README to gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: update available Helm charts"
            git push origin gh-pages
          else
            echo "README is already up to date."
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Publish and Sign OCI Charts
        run: |
          for chart in .cr-release-packages/*.tgz; do
            [ -f "$chart" ] || continue
            file_name=${chart##*/}
            chart_name=${file_name%-*}
            helm push "$chart" oci://ghcr.io/${GITHUB_REPOSITORY} \
              |& tee helm-push-output.log
            digest=$(awk -F "[, ]+" '/Digest/{print $NF}' helm-push-output.log)
            cosign sign "ghcr.io/${GITHUB_REPOSITORY}/${chart_name}@${digest}"
          done
        env:
          COSIGN_YES: true
